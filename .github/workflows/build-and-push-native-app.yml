name: Build Native App

on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, closed]

jobs:
  build:
    if: github.head_ref == 'release-mobile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build native app
        env:
          CAPGO_TOKEN: ${{secrets.CAPGO_TOKEN}}
        run: |
          echo "Building Native app"

      - name: Build native app
        env:
          CAPGO_TOKEN: ${{secrets.CAPGO_TOKEN}}
        run: |
          echo "Building Native app"

  create-native-tag:
    runs-on: ubuntu-latest
    needs: [build] # should be deploy-ios, deploy-android
    if: github.event.pull_request.merged == true # only tag dev branch after success merge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }} # should be digibot PAT

      - name: Create and push native tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="mobile-native-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "$TAG" --force
          echo "Created tag: ${TAG}"

