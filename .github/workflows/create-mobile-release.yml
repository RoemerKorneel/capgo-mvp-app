name: Create Mobile Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release Type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev branch
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Git config
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Delete existing release branch (if exists)
        run: |
          if git ls-remote --heads origin release-mobile | grep -q release-mobile; then
            echo "Deleting existing release-mobile branch..."
            git push origin --delete release-mobile
          fi

      - name: Create release branch
        run: |
          git checkout -b release-mobile
          git push -u origin release-mobile

      - name: Bump version
        run: |
          npx release-it ${{ inputs.release_type }} \
            --ci \
            --no-git.tag

      - name: Push version bump
        run: git push origin release-mobile

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          PR_BODY: |
            PR created by [`release-mobile`](../blob/dev/app.digibtw.nl/api/bin/release-mobile).

            ![Gogogo](https://media.giphy.com/media/e7PqS0VCIsmi6LKkY4/giphy-downsized.gif)
        run: |
          gh pr create \
            --title "Mobile Release PR" \
            --body "$PR_BODY" \
            --head release-mobile \
            --base dev
