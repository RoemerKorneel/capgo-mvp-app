name: Publish Mobile App OTA (Beta)

on:
  push:
    branches: [dev]
#    paths:
#      - 'app.digibtw.nl/react/**'
#      - 'app/package.json'
#      - 'app/capacitor.config.ts'
#      - 'app/ios/**'
#      - 'app/android/**'
#      - 'app/trapeze.yml'

concurrency:
  group: publish-ota-beta
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      native_pending: ${{ steps.check.outputs.native_pending }} # is a native build required/presumably queued?
      last_tag: ${{ steps.check.outputs.last_tag }} # most recent native build version
      app_version: ${{ steps.check.outputs.app_version }} # current app version (package.json)
      bundle_version: ${{ steps.check.outputs.bundle_version }} # capgo bundle version prerelease
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check for pending native changes since last mobile-native-* tag
        id: check
        run: |
          # package.json, capacitor.config.ts, trapeze.yml, android/*, ios/*
#          NATIVE_PATHS="^app/(package\.json|capacitor\.config\.ts|trapeze\.yml|ios/|android/)"
#          APP_VERSION=$(node -p "require('./app/package.json').version")
          NATIVE_PATHS="^(package\.json|capacitor\.config\.json|trapeze\.yml|ios/|android/)"
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT

          LAST_TAG=$(git describe --tags --match "mobile-native-*" --abbrev=0 2>/dev/null || echo "")
          echo "last_tag=${LAST_TAG}" >> $GITHUB_OUTPUT

          if [ -z "$LAST_TAG" ]; then
            echo "No mobile-native-* tag found, doing initial native build."
            echo "native_pending=true" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only "${LAST_TAG}..HEAD" | grep -cE "${NATIVE_PATHS}" || true)
            if [ "$CHANGED" -gt "0" ]; then
              echo "native_pending=true" >> $GITHUB_OUTPUT
            else
              echo "native_pending=false" >> $GITHUB_OUTPUT
            fi
          fi

  publish-ota-beta:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.native_pending == 'false'
#    defaults:
#      run:
#        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build React frontend
        run: |
          npm ci
          npm run build
#          npm ci
#          npm --prefix ../app.digibtw.nl/react ci
#          npm --prefix ../app.digibtw.nl/react run build:prod
#          node remove-unnecessary-files.js

      - name: Compute bundle version
        id: version
        run: |
          APP_VERSION="${{ needs.detect.outputs.app_version }}"
          MAJOR=$(echo "$APP_VERSION" | cut -d. -f1)
          MINOR=$(echo "$APP_VERSION" | cut -d. -f2)
          PATCH=$(echo "$APP_VERSION" | cut -d. -f3)
          # prerelease versioning, {semver}-dev.{run_number}
          BUNDLE_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-dev.${{ github.run_number }}"
          echo "bundle_version=${BUNDLE_VERSION}" >> $GITHUB_OUTPUT

      - name: Upload to Capgo beta MVP
        run: |
          npx @capgo/cli bundle upload \
            --apikey "${{ secrets.CAPGO_TOKEN }}" \
            --app-id com.capgo.mvp.app.app \
            --channel beta \
            --bundle-version "${{ steps.version.outputs.bundle_version }}" \
            --min-update-version "${{ needs.detect.outputs.app_version }}" 

