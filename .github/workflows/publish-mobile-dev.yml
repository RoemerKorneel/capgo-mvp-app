name: Publish Mobile App OTA (Dev)

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'trapeze.yml'
      - 'ios/**'
      - 'android/**'

concurrency:
  group: publish-mobile-dev
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      native_pending: ${{ steps.check.outputs.native_pending }}
      last_tag: ${{ steps.check.outputs.last_tag }}
      app_version: ${{ steps.check.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check for pending native changes since last mobile-native-* tag
        id: check
        run: |
          # app/package.json, app/capacitor.config.ts, app/trapeze.yml, app/android/*, app/ios/* files
          # NATIVE_PATHS="^app/(package\.json|capacitor\.config\.ts|trapeze\.yml|ios/|android/)"
          # APP_VERSION=$(node -p "require('./app/package.json').version")
          NATIVE_PATHS="^(package\.json|capacitor\.config\.json|trapeze\.yml|ios/|android/)"
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT

          LAST_TAG=$(git describe --tags --match "mobile-native-*" --abbrev=0 2>/dev/null || echo "")
          echo "last_tag=${LAST_TAG}" >> $GITHUB_OUTPUT

          if [ -z "$LAST_TAG" ]; then
            echo "No mobile-native-* tag found, doing initial native build."
            echo "native_pending=true" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only "${LAST_TAG}..HEAD" | grep -cE "${NATIVE_PATHS}" || true)
            if [ "$CHANGED" -gt "0" ]; then
              echo "native_pending=true" >> $GITHUB_OUTPUT
            else
              echo "native_pending=false" >> $GITHUB_OUTPUT
            fi
          fi

  publish-ota-beta:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.native_pending == 'false'
#    defaults:
#      run:
#        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build React frontend
        run: |
          npm ci
          npm run build
#          npm ci
#          npm --prefix ../app.digibtw.nl/react ci
#          npm --prefix ../app.digibtw.nl/react run build:prod
#          node remove-unnecessary-files.js

      - name: Compute bundle version
        id: version
        run: |
          APP_VERSION="${{ needs.detect.outputs.app_version }}"
          MAJOR=$(echo "$APP_VERSION" | cut -d. -f1)
          MINOR=$(echo "$APP_VERSION" | cut -d. -f2)
          PATCH=$(echo "$APP_VERSION" | cut -d. -f3)
          # prerelease versioning, {semver}-dev.{run_number}
          BUNDLE_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-dev.${{ github.run_number }}"
          echo "bundle_version=${BUNDLE_VERSION}" >> $GITHUB_OUTPUT

      - name: Upload to Capgo beta
        run: |
          npx @capgo/cli bundle upload \
            --apikey "${{ secrets.CAPGO_TOKEN }}" \
            --app-id com.capgo.mvp.app.app \
            --channel beta \
            --bundle-version "${{ steps.version.outputs.bundle_version }}" \
            --min-update-version "${{ needs.detect.outputs.app_version }}"

  build-native-dev:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.native_pending == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build native app
        run: echo "Building native app"

      - name: Create and push native dev tag
        run: |
          VERSION="${{ needs.detect.outputs.app_version }}"
          TAG="mobile-native-dev-v${VERSION}-build${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created tag: ${TAG}"
