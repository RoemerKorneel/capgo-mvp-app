name: Publish Mobile App OTA (Dev)

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'trapeze.yml'
      - 'ios/**'
      - 'android/**'

concurrency:
  group: publish-mobile-dev
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      native_pending: ${{ steps.check.outputs.native_pending }}
      last_tag: ${{ steps.check.outputs.last_tag }}
      app_version: ${{ steps.check.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check for pending native changes since last mobile-native-* tag
        id: check
        run: |
          NATIVE_PATHS="^(package\.json|capacitor\.config\.json|trapeze\.yml|ios/|android/)"
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT

          LAST_TAG=$(git describe --tags --match "mobile-native-*" --abbrev=0 2>/dev/null || echo "")
          echo "last_tag=${LAST_TAG}" >> $GITHUB_OUTPUT

          echo "App version: ${APP_VERSION}"
          echo "Last native tag: ${LAST_TAG:-none}"

          if [ -z "$LAST_TAG" ]; then
            echo "No mobile-native-* tag found — initial native build required"
            echo "native_pending=true" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only "${LAST_TAG}..HEAD" | grep -cE "${NATIVE_PATHS}" || true)
            if [ "$CHANGED" -gt "0" ]; then
              echo "Native changes detected since ${LAST_TAG} (${CHANGED} file(s)) — native build required"
              echo "native_pending=true" >> $GITHUB_OUTPUT
            else
              echo "No native changes since ${LAST_TAG} — OTA update"
              echo "native_pending=false" >> $GITHUB_OUTPUT
            fi
          fi

  publish-ota-beta:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.native_pending == 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build React frontend
        run: |
          echo "Installing dependencies..."
          npm ci
          echo "Building..."
          npm run build

      - name: Compute bundle version
        id: version
        run: |
          APP_VERSION="${{ needs.detect.outputs.app_version }}"
          MAJOR=$(echo "$APP_VERSION" | cut -d. -f1)
          MINOR=$(echo "$APP_VERSION" | cut -d. -f2)
          PATCH=$(echo "$APP_VERSION" | cut -d. -f3)
          BUNDLE_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-dev.${{ github.run_number }}"
          echo "bundle_version=${BUNDLE_VERSION}" >> $GITHUB_OUTPUT
          echo "Bundle version: ${BUNDLE_VERSION}"

      - name: Upload to Capgo beta
        run: |
          echo "Uploading bundle ${{ steps.version.outputs.bundle_version }} to beta channel..."
          npx @capgo/cli bundle upload -a "${{ secrets.CAPGO_TOKEN }}" -b "${{ steps.version.outputs.bundle_version }}" --channel beta --delta
          echo "Done"

  build-native-dev:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.native_pending == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm ci

      - name: Build web assets
        run: |
          echo "Building web assets..."
          npm run build

      - name: Sync Capacitor
        run: |
          echo "Syncing Capacitor..."
          npx cap sync

      - name: Build native app
        run: echo "Building native app..."

      - name: Create and push native dev tag
        run: |
          VERSION="${{ needs.detect.outputs.app_version }}"
          TAG="mobile-native-dev-v${VERSION}-build${{ github.run_number }}"
          echo "Creating tag: ${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Tag pushed: ${TAG}"
