name: Publish Mobile App (Production)

on:
  push:
    branches: [release]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      native_pending: ${{ steps.check.outputs.native_pending }}
      app_version: ${{ steps.check.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check for native changes in PR diff
        id: check
        run: |
          NATIVE_PATHS="^(package\.json|capacitor\.config\.json|trapeze\.yml|ios/|android/)"
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT

          echo "App version: ${APP_VERSION}"

          CHANGED=$(git diff --name-only origin/prod...HEAD | grep -cE "${NATIVE_PATHS}" || true)
          if [ "$CHANGED" -gt "0" ]; then
            echo "Native changes detected in PR (${CHANGED} file(s)) — OTA skipped"
            echo "native_pending=true" >> $GITHUB_OUTPUT
          else
            echo "No native changes in PR — OTA update"
            echo "native_pending=false" >> $GITHUB_OUTPUT
          fi

  publish-ota-prod:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.native_pending == 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build React frontend
        run: |
          echo "Installing dependencies..."
          npm ci
          echo "Building..."
          npm run build

      - name: Compute bundle version
        id: version
        run: |
          APP_VERSION="${{ needs.detect.outputs.app_version }}"
          MAJOR=$(echo "$APP_VERSION" | cut -d. -f1)
          MINOR=$(echo "$APP_VERSION" | cut -d. -f2)
          PATCH=$(echo "$APP_VERSION" | cut -d. -f3)
          BUNDLE_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-prod.${{ github.run_number }}"
          echo "bundle_version=${BUNDLE_VERSION}" >> $GITHUB_OUTPUT
          echo "Bundle version: ${BUNDLE_VERSION}"

      - name: Upload to Capgo production
        run: |
          echo "Uploading bundle ${{ steps.version.outputs.bundle_version }} to production channel..."
          npx @capgo/cli bundle upload -a "${{ secrets.CAPGO_TOKEN }}" -b "${{ steps.version.outputs.bundle_version }}" --channel production --delta
          echo "Done"

  skip-ota-native-pending:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.native_pending == 'true'
    steps:
      - name: Native changes detected — OTA skipped, triggering native build
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          echo "Native changes in PR — skipping OTA, triggering prepare-mobile-release..."
          gh workflow run prepare-mobile-release.yml \
            --repo "${{ github.repository }}" \
            --ref dev \
            -f release_type=patch
          echo "Workflow triggered"
